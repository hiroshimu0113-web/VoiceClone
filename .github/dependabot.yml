version: 2
updates:
  # GitHub Actions: 全プロジェクト共通 (SHA ピン留めした uses の更新もここで行う)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # 公開直後の乗っ取り版を避けるため 7 日待つ (セキュリティ更新は対象外で即時)
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

